<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBE6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Soft glow behind play -->
  <circle cx="120" cy="120" r="58" fill="#FFFFFF" opacity="0.18" filter="url(#soft)"/>

  <!-- Concentric "explain" rings -->
  <circle cx="120" cy="120" r="82" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.35" fill="none" stroke-dasharray="6 10"/>
  <circle cx="120" cy="120" r="66" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" fill="none"/>

  <!-- Play / explainer triangle (white) -->
  <path d="M104 88 L150 120 L104 152 Z" fill="#FFFFFF"/>

  <!-- Spark: knowledge clicking -->
  <g stroke="url(#stroke)" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="26" x2="120" y2="42"/>
    <line x1="214" y1="120" x2="198" y2="120"/>
    <line x1="120" y1="214" x2="120" y2="198"/>
    <line x1="26" y1="120" x2="42" y2="120"/>
    <line x1="187" y1="53" x2="176" y2="64"/>
    <line x1="187" y1="187" x2="176" y2="176"/>
    <line x1="53" y1="187" x2="64" y2="176"/>
    <line x1="53" y1="53" x2="64" y2="64"/>
  </g>

  <!-- Tiny knowledge dot -->
  <circle cx="150" cy="120" r="5" fill="#FFB300"/>
</svg>
